<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Alert Trigger</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --error: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      width: 100%;
      max-width: 420px;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
      border: 1px solid var(--border);
    }

    .header {
      margin-bottom: 1.5rem;
    }

    .header h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text);
    }

    .header p {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    button {
      width: 100%;
      padding: 0.75rem 1rem;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    button:active:not(:disabled) {
      transform: scale(0.99);
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .status {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.875rem;
      display: none;
    }

    .status.success {
      display: block;
      background-color: #f0fdf4;
      color: var(--success);
      border: 1px solid #bbf7d0;
    }

    .status.error {
      display: block;
      background-color: #fef2f2;
      color: var(--error);
      border: 1px solid #fecaca;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #ffffff;
      border-top-color: transparent;
      border-radius: 50%;
      display: none;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="header">
      <h1>Weather Alert Trigger</h1>
      <p>Send a city payload to the alert webhook</p>
    </div>

    <form id="webhookForm">
      <div class="form-group">
        <label for="cityInput">City Name</label>
        <input type="text" id="cityInput" name="city" placeholder="e.g. London, Tokyo, New York" required
          autocomplete="off" />
      </div>

      <button type="submit" id="submitBtn">
        <span class="spinner" id="spinner"></span>
        <span id="btnText">Send Alert</span>
      </button>

      <div class="status" id="statusMessage"></div>
    </form>
  </div>

  <script>
    const WEBHOOK_URL = "http://localhost:5678/webhook/weather-alert";

    const form = document.getElementById("webhookForm");
    const cityInput = document.getElementById("cityInput");
    const submitBtn = document.getElementById("submitBtn");
    const btnText = document.getElementById("btnText");
    const spinner = document.getElementById("spinner");
    const statusMessage = document.getElementById("statusMessage");

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      spinner.style.display = isLoading ? "block" : "none";
      btnText.textContent = isLoading ? "Sending..." : "Send Alert";
    }

    function showStatus(message, type) {
      statusMessage.textContent = message;
      statusMessage.className = `status ${type}`;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      statusMessage.className = "status";
      setLoading(true);

      const payload = {
        city: cityInput.value.trim()
      };

      try {
        const response = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          throw new Error(`Server returned HTTP ${response.status}`);
        }

        showStatus("Payload delivered successfully!", "success");
        form.reset();
      } catch (err) {
        showStatus(`Failed to send: ${err.message}`, "error");
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>

</html>
