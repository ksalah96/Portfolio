<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Onboarding Form</title>
    <style>
        :root {
            --primary: #2563EB;
            --primary-hover: #1D4ED8;
            --bg: #F8FAFC;
            --card-bg: #FFFFFF;
            --text: #0F172A;
            --border: #CBD5E1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 480px;
        }

        h2 {
            margin-top: 0;
            color: var(--primary);
            text-align: center;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .row {
            display: flex;
            gap: 12px;
        }

        .col {
            flex: 1;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.875rem;
        }

        input[type="text"],
        input[type="tel"],
        input[type="date"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .checkbox-group input {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .checkbox-group label {
            margin: 0;
            font-size: 0.875rem;
            font-weight: normal;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .result-card {
            display: none;
            margin-top: 24px;
            padding: 20px;
            background-color: #EFF6FF;
            border: 1px solid #BFDBFE;
            border-radius: 8px;
        }

        .result-card h3 {
            margin-top: 0;
            color: var(--primary);
            font-size: 1.1rem;
            margin-bottom: 14px;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px dashed #93C5FD;
            font-size: 0.9rem;
        }

        .result-item strong {
            color: #334155;
        }

        .highlight {
            font-weight: bold;
            color: var(--primary);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>HR Onboarding Form</h2>
    <form id="onboardingForm">
        
        <div class="row">
            <div class="form-group col">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" required placeholder="John">
            </div>
            <div class="form-group col">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" required placeholder="Doe">
            </div>
        </div>

        <div class="form-group">
            <label for="title">Title / Role</label>
            <input type="text" id="title" required placeholder="Automation Developer">
        </div>

        <div class="row">
            <div class="form-group col">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" required>
            </div>
            <div class="form-group col">
                <label for="gender">Gender</label>
                <select id="gender" required>
                    <option value="">Select</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="mobile">Mobile Number</label>
            <input type="tel" id="mobile" required placeholder="+1 234 567 8900">
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="terms" required>
            <label for="terms">I accept the terms and conditions</label>
        </div>

        <button type="submit">Submit & Generate Credentials</button>
    </form>

    <div id="resultCard" class="result-card">
        <h3>Generated Credentials</h3>
        <div class="result-item">
            <strong>Full Name:</strong> <span id="resName"></span>
        </div>
        <div class="result-item">
            <strong>Title:</strong> <span id="resTitle"></span>
        </div>
        <div class="result-item">
            <strong>Employee ID:</strong> <span id="resID" class="highlight"></span>
        </div>
        <div class="result-item">
            <strong>Generated Email:</strong> <span id="resEmail" class="highlight"></span>
        </div>
    </div>
</div>

<script>
    document.getElementById('onboardingForm').addEventListener('submit', function(e) {
        e.preventDefault();

        // 1. Get Values
        const firstName = document.getElementById('firstName').value.trim();
        const lastName = document.getElementById('lastName').value.trim();
        const title = document.getElementById('title').value.trim();

        // 2. Generate Unique Employee ID (Format: EMP-YEAR-4DIGITS)
        const currentYear = new Date().getFullYear();
        const randomID = Math.floor(1000 + Math.random() * 9000);
        const employeeId = `EMP-${currentYear}-${randomID}`;

        // 3. Generate Email (Format: firstname.lastname@company.com)
        const cleanFirst = firstName.toLowerCase().replace(/[^a-z0-9]/g, '');
        const cleanLast = lastName.toLowerCase().replace(/[^a-z0-9]/g, '');
        const generatedEmail = `${cleanFirst}.${cleanLast}@company.com`;

        // 4. Update Result Card
        document.getElementById('resName').textContent = `${firstName} ${lastName}`;
        document.getElementById('resTitle').textContent = title;
        document.getElementById('resID').textContent = employeeId;
        document.getElementById('resEmail').textContent = generatedEmail;

        // 5. Show Card
        document.getElementById('resultCard').style.display = 'block';
    });
</script>

</body>
</html>
